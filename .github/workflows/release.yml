name: Build and Release

on:
  push:
  pull_request:

permissions:
  contents: write

env:
  # 强制让 GitHub Actions 使用 Node.js 24 引擎运行插件，消除老版本弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Tauri Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 前端构建检查
        run: npm run build

      - name: 前端单元测试
        run: npm test

      - name: 运行 Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    env:
      # 注入 tag 版本号（v1.0.3），前端标题与应用元数据自动跟随
      APP_VERSION: ${{ github.ref_name }}
      # Rust 端窗口标题版本（app_version.rs 编译期读取）
      VNDB_GUI_VERSION: ${{ github.ref_name }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 从 tag 同步应用版本号
        shell: bash
        run: node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.env.APP_VERSION.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      - name: 运行 Windows 打包脚本
        shell: cmd
        run: call build_gui_exe.bat

      - name: 重命名为规范格式
        shell: cmd
        run: move "release\VNDB-GUI.exe" "vndb-gui-${{ github.ref_name }}-windows.exe"

      - name: 上传 Windows 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: vndb-gui-${{ github.ref_name }}-windows.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    env:
      APP_VERSION: ${{ github.ref_name }}
      VNDB_GUI_VERSION: ${{ github.ref_name }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Tauri Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 从 tag 同步应用版本号
        run: node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.env.APP_VERSION.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      - name: 运行 Linux 打包脚本
        run: |
          chmod +x build_gui_linux.sh
          ./build_gui_linux.sh

      - name: 重命名为规范格式
        run: mv release/VNDB-GUI vndb-gui-${{ github.ref_name }}-linux

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: vndb-gui-${{ github.ref_name }}-linux

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    env:
      APP_VERSION: ${{ github.ref_name }}
      VNDB_GUI_VERSION: ${{ github.ref_name }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 从 tag 同步应用版本号
        run: node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.env.APP_VERSION.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建 macOS 应用
        run: npm run tauri build

      - name: 打包 .app 为 zip
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc VNDB-GUI.app "$GITHUB_WORKSPACE/vndb-gui-${{ github.ref_name }}-macos.zip"

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: vndb-gui-${{ github.ref_name }}-macos.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux
      - build-macos

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 提取当前版本的 Changelog 条目
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { found=1 }
            found && $0 ~ "^## \\[" && $0 !~ "^## \\[" tag "\\]" { exit }
            found
          ' CHANGELOG.md > release_body.md

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          # 显式指定 name，把 tag 中的版本号写进 Release 标题（不传时标题不带版本号）
          name: VNDB-GUI ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            artifacts/windows/vndb-gui-${{ github.ref_name }}-windows.exe
            artifacts/linux/vndb-gui-${{ github.ref_name }}-linux
            artifacts/macos/vndb-gui-${{ github.ref_name }}-macos.zip
          body_path: release_body.md
